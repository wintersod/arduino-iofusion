[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = auto
extra_scripts = pre:tools/git_version.py
build_flags = -I lib/IOFusion/include

[env:native]
platform = native
test_build_src = yes
test_filter = iofusion
build_src_filter =
	+<lib/IOFusion/src/iofusion_analog_sampler.cpp>
	+<lib/IOFusion/src/iofusion_digital_signal_meter.cpp>
	+<lib/IOFusion/src/iofusion_quadrature_signal_generator.cpp>
	+<lib/IOFusion/src/iofusion_avr_timer1_pwm.cpp>
	+<lib/IOFusion/src/iofusion_avr_timer2_scheduler.cpp>
	-<src/*>
build_flags =
	-DUNIT_TEST
	-I test/mocks
	-I lib/IOFusion/include
	--coverage
	-O0
	-g

[platformio]
default_envs = uno

